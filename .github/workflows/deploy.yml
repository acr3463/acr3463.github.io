name: Pages Workflow
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: gh-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Apply
        env:
          A4DBB1: ${{ secrets.A4DBB1 }}
          BE4094: ${{ secrets.BE4094 }}
        run: |
          python3 -c "
          import os, sys, pathlib
          tag_a = os.environ.get('A4DBB1', '')
          tag_b = os.environ.get('BE4094', '')
          fpath = pathlib.Path('index.html')
          orig = fpath.read_text(encoding='utf-8')
          updated = orig
          if tag_a:
              updated = updated.replace('<!-- c8c1288df563f29176470014c520c0b7bd04bd52e959 -->', tag_a)
          if tag_b:
              updated = updated.replace('<!-- c203a4c278a15b4389e43e3b9e40a5 -->', tag_b)
          if updated == orig and (tag_a or tag_b):
              sys.exit(1)
          if updated != orig:
              fpath.write_text(updated, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
